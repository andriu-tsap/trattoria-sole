name: Audyt interfejsu
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save lighthouse@12 playwright
      - run: npx playwright install --with-deps chromium
      - run: node audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: audyt-i-zrzuty
          path: screenshots/
